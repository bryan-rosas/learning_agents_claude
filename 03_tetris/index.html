<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="overlay-msg" class="hidden"></p>
        <form id="name-form" class="hidden">
          <input id="name-input" type="text" maxlength="12" value="Jugador" autocomplete="off" spellcheck="false" />
          <button type="submit" id="save-btn">Guardar</button>
        </form>
        <button id="restart-btn">Jugar</button>
        <div id="records" class="records hidden">
          <span class="label">RECORDS</span>
          <table class="records-table">
            <thead>
              <tr><th>#</th><th>NOMBRE</th><th>PUNTOS</th><th>LÍNEAS</th><th>COMBO</th><th>FECHA</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <p id="records-stats"></p>
          <button id="reset-records-btn" type="button">Resetear records</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
